<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="ESP32 DevKit V1 GPIO13 LED blink wiring">
  <title>ESP32 DevKit V1 — GPIO13 LED blink</title>
  <rect width="920" height="420" fill="#f7f7f4"/>
  <text x="460" y="36" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a">ESP32 DevKit V1 — GPIO13 blink wiring</text>
  <text x="460" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#555">3.3 V GPIO only · series resistor required · do not use 5V / VIN</text>

  <!-- Board -->
  <rect x="40" y="88" width="250" height="280" rx="10" fill="#1e2a36" stroke="#0d151c" stroke-width="2"/>
  <rect x="118" y="118" width="94" height="78" rx="4" fill="#2c3a48"/>
  <text x="165" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#dce6ef">ESP32</text>
  <text x="165" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#9aa8b5">DevKit V1</text>
  <rect x="148" y="328" width="34" height="22" rx="3" fill="#cfd6dc"/>
  <text x="165" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#9aa8b5">USB</text>

  <!-- Right-side pins of interest -->
  <circle cx="278" cy="168" r="6" fill="#e8edf2"/>
  <text x="268" y="154" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e8edf2">D13 / GPIO13</text>
  <circle cx="278" cy="198" r="6" fill="#111"/>
  <text x="268" y="202" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e8edf2">GND</text>
  <circle cx="278" cy="228" r="6" fill="#c0392b"/>
  <text x="268" y="232" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e8edf2">VIN / 5V — unused</text>

  <!-- Breadboard -->
  <rect x="520" y="100" width="360" height="250" rx="8" fill="#f3f0e6" stroke="#c9c3b0"/>
  <text x="700" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#333">Breadboard</text>
  <line x1="540" y1="140" x2="860" y2="140" stroke="#d4a0a0" stroke-width="3"/>
  <line x1="540" y1="152" x2="860" y2="152" stroke="#8aa4c8" stroke-width="3"/>

  <!-- Resistor -->
  <rect x="600" y="200" width="88" height="22" rx="4" fill="#d8b56a" stroke="#6b4e1f"/>
  <text x="644" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#333">220 Ω</text>
  <line x1="580" y1="211" x2="600" y2="211" stroke="#555" stroke-width="2"/>
  <line x1="688" y1="211" x2="718" y2="211" stroke="#555" stroke-width="2"/>

  <!-- LED -->
  <circle cx="760" cy="211" r="16" fill="#e74c3c" stroke="#8b1e16" stroke-width="2"/>
  <polygon points="760,195 772,211 748,211" fill="#c0392b"/>
  <line x1="754" y1="227" x2="754" y2="268" stroke="#444" stroke-width="3"/>
  <line x1="766" y1="227" x2="766" y2="252" stroke="#444" stroke-width="3"/>
  <text x="790" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">LED + long</text>
  <text x="790" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1a1a1a">LED − short</text>

  <!-- Wires -->
  <path d="M284 168 C 430 168, 430 211, 580 211" fill="none" stroke="#2f6fed" stroke-width="4"/>
  <path d="M766 252 C 766 300, 400 300, 284 198" fill="none" stroke="#222" stroke-width="4"/>
  <text x="400" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2f6fed">GPIO13 → resistor → LED +</text>
  <text x="400" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#222">LED − → GND</text>

  <text x="460" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#444">Keep DHT22 on GPIO4 if already wired. Do not share this GPIO with the WS2812 strip.</text>
</svg>
